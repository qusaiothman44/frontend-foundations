<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Review</title>
  </head>
  <body>
    <main>
      <section class="container">
        <div class="title">
          <h2>Our review</h2>
          <div class="underline"></div>
        </div>

        <article class="review">
          <div class="img-container"><img src="https://www.course-api.com/images/people/person-1.jpeg" alt="" id="reviw-img"></div>
          <h4 id="author">Sara jones</h4>
          <p id="job">ux designer</p>
          <p id="info">
            Lorem ipsum dolor sit amet consectetur, adipisicing elit. Beatae,
            quas repellendus? Dolor explicabo qui, natus dicta quis numquam iure
            odit possimus architecto, iste pariatur, aliquid hic fuga. Ipsam,
            totam placeat.
          </p>
          <div class="button-container">
            <button class="prev-btn">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button class="next-btn">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
            <button class="random-btn">suprise me</button>
          </div>
        </article>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
