<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
        <h1 class="main">Students Grade</h1>
   <form id="students-form">
      <input type="text" name="name" id="name" placeholder="Write Student Name" required />
      <input
        type="number"
        name="grade-1"
        id="grade-1"
        min="0"
        max="100"
        placeholder="Grade 1"
        required
      />
      <input
        type="number"
        name="grade-2"
        id="grade-2"
        min="0"
        max="100"
        placeholder="Grade 2"
        required
      />
      <input
        type="number"
        name="grade-3"
        id="grade-3"
        min="0"
        max="100"
        placeholder="Grade 3"
        required
      />
      <input type="submit" value="Add Student" id="submit"/>
    </form>
    <input type="search" name="search" id="search" placeholder="Search..." />
    <div class="stud-container">
          <h1>Students</h1>
           <label> <input type="radio" name="sort" value="avg" checked>Sort by Average</label>
        <label> <input type="radio" name="sort" value="name">Sort by Name</label>

    <ul id="students-list"> 
       
    </ul>
    <div class="stud-result">
        <p id="total-avg"></p>
    <p id="top-stu"></p>
    <p id="Fail-stu"></p>
    </div>
       
    </div>
     
 

    </div>
 
    <script src="script.js"></script>
  </body>
</html>
