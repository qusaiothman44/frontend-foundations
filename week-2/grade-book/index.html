<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form id="students-form">
      <input type="text" name="name" id="name" required />
      <input
        type="number"
        name="grade-1"
        id="grade-1"
        min="0"
        max="100"
        required
      />
      <input
        type="number"
        name="grade-2"
        id="grade-2"
        min="0"
        max="100"
        required
      />
      <input
        type="number"
        name="grade-3"
        id="grade-3"
        min="0"
        max="100"
        required
      />
      <input type="submit" value="Add Student" />
    </form>
    <input type="search" name="search" id="search" />
    <ul id="students-list"></ul>
    <p id="total-avg"></p>
    <p id="top-stu"></p>
    <p id="Fail-stu"></p>
    <script src="script.js"></script>
  </body>
</html>
