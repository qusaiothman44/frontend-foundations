<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
        <h1>FAQ Accordion</h1>
      <div class="feq-item">
        <button class="feq-qu">
          What is JS?
          <i class="fa-solid fa-chevron-down"></i>
        </button>
        <p class="feq-ans hidden">JavaScript makes websites interactive</p>
      </div>
      <div class="feq-item">
        <button class="feq-qu">
          What is HTML?
          <i class="fa-solid fa-chevron-down"></i>
        </button>
        <p class="feq-ans hidden">HTML defines the structure of a webpage.</p>
      </div>
      <div class="feq-item">
        <button class="feq-qu">
          What is CSS? <i class="fa-solid fa-chevron-down"></i>
        </button>
        <p class="feq-ans hidden">CSS styles the appearance of a webpage.</p>
      </div>
      <div class="feq-item">
        <button class="feq-qu">
          What is the DOM? <i class="fa-solid fa-chevron-down"></i>
        </button>
        <p class="feq-ans hidden">
          The DOM lets JavaScript access and modify webpage elements.
        </p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
